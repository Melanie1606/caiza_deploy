name: Deploy Caiza

on:
  push:
    branches: "caiza"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"

    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push Docker image Caiza v1.0.5
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: ghcr.io/melanie1606/caiza:1.0.5

    - name: 🧪 Test SSH connection
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "SSH OK en Caiza"
          hostname
          whoami

    - name: 📤 Enviar stack.yml al servidor
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/despliegue"

    - name: 🚀 Despliegue automático del stack Caiza
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "📂 Moviéndome al directorio de despliegue"
          cd /home/${{ secrets.VPS_USER }}/despliegue

          echo "🗑️ Eliminando stack previo (si existe)"
          docker stack rm caiza || true
          sleep 5

          echo "🚀 Desplegando nuevo stack Caiza"
          docker stack deploy -c stack.yml --with-registry-auth caiza

          echo "✅ Despliegue completado con éxito"

